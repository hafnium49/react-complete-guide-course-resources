<!--
  ============================================================================
  index.html — LESSON 582
  ============================================================================

  This page has no visible content — its only purpose is to load a script
  and display output in the browser's developer tools console.

  LESSON 582 UPDATE:

  The <script> tag now references "with-typescript.js" — the COMPILED
  output of with-typescript.ts. Browsers cannot execute .ts files directly,
  so we always point at the .js file that the TypeScript compiler (tsc)
  produces.

  Previously (lessons 580-581), this page loaded "no-typescript.js" to
  demonstrate the string-concatenation bug caused by dynamic typing. Now
  that TypeScript is installed and the corrected version has been compiled,
  loading with-typescript.js produces the correct result: 7.

  To switch back to the buggy plain-JavaScript version, change the src
  attribute to "no-typescript.js".

  ============================================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React + TypeScript</title>
  <!-- The compiled JavaScript output of with-typescript.ts. This file was
       generated by running "npx tsc with-typescript.ts" — it contains the
       same logic but with all type annotations stripped and modern syntax
       (like const) downleveled to var for older-browser compatibility. -->
  <script src="with-typescript.js"></script>
</head>

<body>

</body>

</html>
